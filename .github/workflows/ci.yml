name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        redis-version: [7]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@master
        with:
          ruby-version: 3.4.4
          bundler-cache: true

      - name: Build and test with rspec
        env:
          CI: true
        run: |
          bundle exec rspec

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: rspec-results
          path: tmp/spec
          retention-days: 90

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'tmp/spec/rspec*.xml'
